services:
  llm:
    build: .
    container_name: obrador-llm
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      PORT: "8080"
      AUTO_DOWNLOAD_DEFAULT: "1"
      CTX_SIZE: "2048"
      LOAD_TIMEOUT: "600"
      GENERATION_TIMEOUT: "180"
      MAX_LOADED_MODELS: "1"
      N_GPU_LAYERS: "0"
      MALLOC_ARENA_MAX: "2"
      # Obligatorio: defínelo en .env. Vacío = panel y /v1 cerrados (503).
      MASTER_SECRET: "${MASTER_SECRET:-}"
      DEFAULT_REPO: bartowski/Qwen_Qwen3.5-2B-GGUF
      DEFAULT_FILE: Qwen_Qwen3.5-2B-Q4_K_M.gguf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

  enjambre:
    profiles: ["enjambre"]
    build:
      context: .
      dockerfile: enjambre/Dockerfile
    container_name: obrador-enjambre
    ports:
      - "8090:8090"
    volumes:
      - ./enjambre/artifacts:/data/enjambre/artifacts
      - enjambre-hf:/data/hf-home
    environment:
      ENJAMBRE_PORT: "8090"
      ENJAMBRE_DELTAS: /data/enjambre/artifacts
      ENJAMBRE_MODEL: HuggingFaceTB/SmolLM2-135M-Instruct
      ENJAMBRE_ADAPTIVE_MODEL: qwen2.5-0.5b
      ENJAMBRE_ADAPTIVE_ROOT: /data/enjambre/artifacts/adaptive-0.5b
      OMP_NUM_THREADS: "8"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  enjambre-hf:
