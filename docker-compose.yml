services:
  llm:
    build: .
    container_name: obrador-llm
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      PORT: "8080"
      AUTO_DOWNLOAD_DEFAULT: "1"
      CTX_SIZE: "2048"
      LOAD_TIMEOUT: "1200"
      MAX_LOADED_MODELS: "1"
      N_GPU_LAYERS: "0"
      DEFAULT_REPO: bartowski/Qwen_Qwen3.5-9B-GGUF
      DEFAULT_FILE: Qwen_Qwen3.5-9B-Q4_K_M.gguf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
