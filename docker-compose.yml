services:
  llm:
    build: .
    container_name: obrador-llm
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      PORT: "8080"
      AUTO_DOWNLOAD_DEFAULT: "1"
      CTX_SIZE: "2048"
      LOAD_TIMEOUT: "600"
      GENERATION_TIMEOUT: "180"
      MAX_LOADED_MODELS: "1"
      N_GPU_LAYERS: "0"
      MALLOC_ARENA_MAX: "2"
      # Obligatorio: defínelo en .env. Vacío = panel y /v1 cerrados (503).
      MASTER_SECRET: "${MASTER_SECRET:-}"
      DEFAULT_REPO: bartowski/Qwen_Qwen3.5-2B-GGUF
      DEFAULT_FILE: Qwen_Qwen3.5-2B-Q4_K_M.gguf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

  # Entrenamiento LoRA (opcional). No arranca con "docker compose up":
  #   docker compose --profile train run --rm finetune
  # Deja el GGUF en ./data/models y lo registra en el panel del servicio llm.
  finetune:
    profiles: ["train"]
    build:
      context: .
      dockerfile: finetune/Dockerfile
      # GPU: BASE=pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime y TORCH_INDEX=skip
      args:
        BASE: "${FT_BASE_IMAGE:-python:3.12-slim}"
        TORCH_INDEX: "${FT_TORCH_INDEX:-https://download.pytorch.org/whl/cpu}"
    volumes:
      - ./data:/data
    environment:
      DATA_DIR: /data
      BASE_MODEL: "${FT_BASE_MODEL:-HuggingFaceTB/SmolLM2-135M-Instruct}"
      EPOCHS: "${FT_EPOCHS:-8}"
      SEED: "27"
      TRAIN_ARGS: "${FT_TRAIN_ARGS:-}"
    # GPU (NVIDIA Container Toolkit): descomenta
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
